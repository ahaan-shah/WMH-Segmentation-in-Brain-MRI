# code/metadata/dataset.yaml
#
# Single source of truth for every project parameter that would otherwise be a
# magic number in code (CLAUDE.md Section 5.5). config.py loads this file and
# exposes its values as Python constants; nothing else should hardcode these
# numbers. Each entry below records not just the value but the decision
# rationale, so this file doubles as the record required by CLAUDE.md Section 10.

seed: 42  # single project-wide seed; never re-rolled (CLAUDE.md Section 5.4 / 5.5)

labels:
  background: 0
  wmh: 1        # WMH mask = (raw_mask == 1), never (raw_mask > 0)
  other: 2      # "other pathology" — excluded from WMH burden, treated as don't-care
                # at evaluation time (see checks/evaluation.py: label-2 voxels are
                # masked out of the *result* image before scoring, so a prediction
                # landing in a label-2 region is neither rewarded nor penalised).
                # CLAUDE.md Decision #1 / Section 11.2.

working_space: flair
# Nothing is resampled into T1 space. Reference masks ship in FLAIR space; FLAIR
# is the coordinate system for the whole project. CLAUDE.md Decision #2.

periventricular:
  threshold_mm: 10.0        # DeCarli et al. 2005; also used by UK Biobank and FSL BIANCA
  sensitivity_thresholds_mm: [5.0, 10.0, 15.0]
  # Run the periventricular/deep split at all three and report sensitivity in W4,
  # converting a hard-coded constant into a defensible analysis (Section 11.1).
  distance_metric: euclidean_mm  # scipy.ndimage.distance_transform_edt with
                                  # sampling=voxel_spacing — NEVER voxel counts.
                                  # CLAUDE.md flags this as the single most likely
                                  # silent bug in the project (anisotropic FLAIR).

  ventricle_source: synthseg_on_raw_t1
  # DECIDED IN WEEK 4 BY MEASUREMENT — features/sweep_synthseg.py.
  #
  # Week 1 prototyped a FLAIR-darkness heuristic (Section 11.1, Fallback B)
  # because neither FreeSurfer nor FSL was installed. Four such heuristics were
  # later tried and all failed at roughly a 28% success rate; root cause was
  # Week 2's CSF class being 314-439 mL (~25% of brain), validated for NAWM
  # accuracy rather than CSF accuracy. FreeSurfer 8.2.0 was then installed,
  # making SynthSeg available as originally preferred.
  #
  # WHICH IMAGE TO FEED IT was the open question. Three candidates, one subject
  # per site, rule fixed before results were seen:
  #   (a) geometry must match the FLAIR grid exactly  -- all three passed
  #   (b) lateral ventricle volume within 5-150 mL    -- all three passed
  #       (band deliberately wide: cohort is 70.1 +- 9.3 y WITH cerebrovascular
  #        disease, so a "normal adult" 10-40 mL band would reject correct
  #        segmentations on exactly the subjects this project is about)
  #   (c) tiebreaker -- how much TRUE WMH the ventricle label absorbs, since
  #       periventricular lesions sit against the ventricle wall and
  #       contamination there corrupts the 10 mm split where it matters most:
  #
  #         raw T1        2.96%   <- SELECTED
  #         flair_norm    4.79%
  #         raw FLAIR     4.95%   (11.64% on Amsterdam alone -- disqualifying)
  #
  # T1 costs nothing extra: W1.8 established orig/T1.nii.gz already shares
  # FLAIR's exact shape and affine, so no registration is involved.
  #
  # Cross-input agreement was strong (0.7-6% spread on ventricle volume), which
  # is what confirmed Utrecht_0's unusually large 128 mL ventricle is genuine
  # atrophy rather than a segmentation failure -- all three inputs independently
  # landed within 5% of each other.
  ventricle_labels: [4, 43, 5, 44]   # FreeSurfer lateral + inferior-lateral
  # Inferior-lateral horns are included because they are continuous with the
  # lateral ventricles; excluding them would open a false "deep" gap at the
  # temporal horn.
  measured_contamination_full_cohort:
    mean_pct: 4.10
    worst_pct: 16.61          # training_Amsterdam_GE3T_106
    n_subjects: 60
  # CORRECTION, recorded rather than quietly replaced. The 3-subject input sweep
  # above measured 2.96% for raw T1; across all 60 the figure is 4.10%, with a
  # worst case of 16.61%. n=3 understated it by ~40%.
  #
  # This is the THIRD time in this project a small probe has misled (Week 2: an
  # n=1-per-site N4 probe named the wrong damaged site; an early crude-proxy
  # normalisation comparison gave the wrong ranking). The standing lesson holds:
  # probe to check feasibility, sweep to decide, and re-measure on the full
  # cohort before quoting a number.
  #
  # It does NOT change the input decision: the T1-vs-FLAIR-vs-flair_norm
  # comparison was made on identical subjects, so the ordering is unaffected,
  # and FLAIR's disqualifying 11.64% on Amsterdam stands. Nor does it change the
  # result, because the contamination is corrected per subject below rather than
  # assumed small.
  lesion_voxels_removed_from_ventricle_mask: true
  # The residual 2.96% contamination is corrected rather than tolerated: a voxel
  # cannot be both lesion and CSF, so lesion voxels are subtracted from the
  # ventricle mask before the distance transform. Left uncorrected it biases the
  # split twice -- those voxels vanish from the lesion set AND inflate the
  # structure distance is measured from. features/periventricular.py.

largest_lesion_diameter:
  definition: equivalent_sphere_diameter
  # Decision #8. Two candidate definitions: max Feret diameter (true geometric
  # extent, but expensive and ambiguous to compute robustly on irregular 3D
  # blobs at scale) vs. equivalent-sphere diameter (deterministic, cheap,
  # derived directly from the voxel-count volume already being computed:
  # d = (6V / pi)^(1/3)). We lock equivalent-sphere diameter as the primary,
  # reported metric for W4 because it is unambiguous and reproducible; max
  # Feret is noted as a stretch/cross-check metric if W4 has slack. Whichever
  # is used, CLAUDE.md requires stating the definition once and applying it
  # consistently — this is that statement.

spatial_distribution:
  primary_reference_frame: hemisphere
  stretch_reference_frame: lobe
  # Decision #9 / Section 11.7. R9 asks for "lobes or hemispheres" — the
  # disjunction is the escape hatch. Hemisphere assignment is near-free via
  # the affine (world x-coordinate vs. brain-centroid midline, CLAUDE.md
  # Section 11.3 Layer 2) and is the guaranteed W4 deliverable. Lobe-level
  # distribution needs an MNI lobar atlas registered into each subject's
  # FLAIR space — real registration infrastructure — and is treated as a
  # stretch goal only if W4 has slack.

dicom:
  required: false
  decision: "Instructor confirmed NIfTI-only is acceptable (2026-08-16)."
  # Resolves Decision #4 / Section 11.5 Option A. The Week 2 schedule line
  # ("DICOM extraction...") is boilerplate shared across all twelve project
  # options in the course; the WMH problem statement itself never mentions
  # DICOM. Source data ships as NIfTI; conversion was performed upstream by
  # the challenge organisers and cannot be repeated (source DICOMs were never
  # released). No DICOM demonstration pipeline is built.

ssim_role: preprocessing_quality
# Decision #5. SSIM is a perceptual image-similarity metric, near-meaningless
# on a binary segmentation mask. Used in W2 to compare denoised vs. original
# FLAIR; Dice / Jaccard / HD95 are used for segmentation quality in W7.

voxel_spacing_policy: stored_never_inferred
# Decision #6. voxel_spacing_x/y/z (mm) is read from the NIfTI header/affine
# for every subject and stored in subject_index.csv. All volumes are computed
# in mm^3 via stored spacing, never assumed isotropic.

splits:
  # Decision #7 + Section 11.6. The 110 official test subjects were confirmed
  # in Week 1 to ship real, non-empty wmh.nii.gz masks (contradicting the
  # stale statement in data/raw/readme.pdf that masks are "only available for
  # training data" — that line is stale relative to the 2022 DataverseNL
  # public release). This means the STRONG evaluation path applies: train/val
  # on the 60 official training subjects, evaluate directly against the
  # official 110 test subjects and the published leaderboard in W7. The 110
  # are therefore the sealed test set — not opened again until W7 — and only
  # the 60 training subjects are split into train/val here.
  test_set: official_110
  train_val_subjects: 60
  train_fraction: 0.8   # 16 of 20 per site
  val_fraction: 0.2     #  4 of 20 per site
  stratify_by: site
  sites: [Utrecht, Singapore, Amsterdam]

ventricle_segmentation:
  method: flair_intensity_threshold
  # Decision #3 / Section 11.1. Preference order was SynthSeg > FSL FAST >
  # FLAIR-threshold trick. Neither FreeSurfer/SynthSeg nor FSL is installed
  # in this environment, and installing either is a multi-GB, non-trivial
  # setup step disproportionate to a throwaway W1.9 feasibility prototype
  # (Section 12: W1.9 exists purely to measure runtime and confirm
  # feasibility, not to produce results). The FLAIR-threshold fallback needs
  # no T1, no registration, and no external tool — fully explainable in the
  # report — so it was used for the W1.9 prototype. SynthSeg remains the
  # PRIMARY candidate for the real W4 ventricle segmentation and should be
  # re-evaluated then if FreeSurfer/SynthSeg becomes available.

severity_classification:
  # Section 11.4. Not implemented in W1 (out of scope, Section 12) — recorded
  # here so the W1.10 distribution check has a documented target to assess
  # feasibility against.
  candidate_routes: [tertiles, fazekas_anchored, regression_then_threshold]
  recommended_route: regression_then_threshold
  min_subjects_per_class: 8  # below this, collapse to two classes (low/high)

evaluation:
  vendored_script: checks/evaluation.py
  source: https://github.com/hjkuijf/wmhchallenge (raw, branch master)
  metrics: [dice, hausdorff95_mm, avd_percent, lesion_recall, lesion_f1]
  label2_handling: >
    Ground-truth image is thresholded to WMH==1 only. Label-2 voxels are used
    to build a mask that is applied to the RESULT (prediction) image only,
    zeroing out any predicted-positive voxels that fall in a label-2 region
    before scoring. Net effect: label-2 regions are "don't care" — a
    prediction there is neither a true positive nor a false positive.

# ---------------------------------------------------------------------------
# Week 2 — pre-processing (R1 skull stripping, R2 normalisation, R3 bias field)
# ---------------------------------------------------------------------------
# Entries whose value is `null` are decided by a measured sweep in the stage
# that owns them, not by assertion. Each records the candidates and the
# selection metric so the choice is reproducible and the report can state why
# the alternatives were rejected — the rubric grades "clear justifications for
# algorithmic choices", which means the rejected options have to be on record.

preprocessing:

  geometry_tolerance_mm: 0.001
  # Tolerance for assert_same_geometry() (metadata/geometry.py), expressed as a
  # maximum world-space displacement of the voxel grid's corners. Exact affine
  # equality is NOT usable on this dataset: orig/T1, pre/FLAIR and wmh.nii.gz
  # carry float32 affines that nibabel promotes to float64, so 6 of 170
  # subjects disagree with their own FLAIR by up to 6.3e-4 mm of pure storage
  # rounding. 0.001 mm sits above that and ~4 orders of magnitude below the
  # smallest voxel dimension in the dataset (0.56 mm), so it cannot mask a real
  # misregistration.

  working_orientation: RAS
  storage_orientation: native
  # Arrays are computed in canonical RAS (loader.load_nifti applies
  # as_closest_canonical); files are written back in the raw FLAIR's own
  # orientation, which is LPS for all 170 subjects. Reason: the vendored
  # official scorer (checks/evaluation.py) reads raw files with SimpleITK and
  # never canonicalises, so a prediction stored in RAS would be scored against
  # an LPS reference with matching shapes and no error — a silent, total
  # collapse of every W7 metric. Enforced by metadata/derived.py being the only
  # sanctioned write path.

  head_mask:
    # Stage 1. A rough head-vs-air mask whose ONLY consumer is N4 (Stage 2).
    # This is not skull stripping — the brain mask is Stage 3. ROADMAP 5.1
    # requires the two to be separate: N4 is degraded by large air regions, but
    # a brain mask computed on an uncorrected image is degraded by the bias
    # field, so the order is coarse mask -> N4 -> proper skull strip.
    threshold_method: multiotsu_3class_lowest
    threshold_classes: 3
    # Two-class Otsu was implemented first and REJECTED on measurement. It
    # assumes a bimodal histogram; these volumes are trimodal (air, brain
    # tissue, very bright scalp fat). On Utrecht subject 11, whose scalp is
    # exceptionally bright, two-class Otsu placed the threshold at 635 —
    # between brain and scalp — and returned a mask containing only the scalp
    # ring, retaining just 25.6% of that subject's reference WMH voxels. It
    # failed 1 of 60 training subjects that way, and produced implausible head
    # volumes (648-2161 mL at Utrecht against 1149-1866 elsewhere).
    # Three-class multi-Otsu, keeping everything above the LOWEST threshold,
    # retains 100.0% of reference WMH on all 60 with zero volume outliers.
    # threshold_triangle and threshold_li also passed the retention test but
    # were far more permissive (triangle: 7607 mL median at Amsterdam), so
    # multi-Otsu is preferred as the tightest method that never fails.
    opening_radius_mm: 1.0
    closing_radius_mm: 3.0
    in_plane_only: true
    # Every structuring element is (2r+1, 2r+1, 1) — in-plane only. Slices are
    # 3.00 mm everywhere against 0.56-1.30 mm in-plane, so a 3x3x3 ball would
    # span ~3 mm in-plane but 9 mm through-plane, closing across two whole
    # slices while barely moving in-plane. Same reasoning as the official
    # scorer's 2D erosion (ROADMAP 1.3). Radii are specified in mm and
    # converted per subject, because a fixed voxel radius would mean a 2.3x
    # different physical size at Amsterdam/Philips (0.56 mm) than at Utrecht.
    largest_component_only: true
    # Singapore volumes carry visible aliasing/ghosting streaks outside the
    # head. Without component selection the mask leaks into them and N4 fits a
    # field across empty space. 26-connectivity, matching checks/evaluation.py.
    min_wmh_retained_fraction: 1.0
    # Acceptance criterion. The head mask must contain every reference WMH
    # voxel — it is a superset of the brain by construction, so anything less
    # means it has cut into brain tissue. Measured: 60/60 at exactly 1.0.

  n4:
    # R3. Own N4 on orig/FLAIR; the organisers' SPM12 pre/FLAIR is kept strictly
    # as an independent comparator, never fed into the pipeline (ROADMAP 5.3).
    shrink_factor: [2, 2, 1]
    # No shrinking along z: slice thickness is already 3.00 mm everywhere,
    # against 0.56-1.30 mm in-plane. Shrinking an already-coarse axis discards
    # the little through-plane information there is.
    iterations_per_level: 50
    convergence_threshold: 0.000001
    candidate_fitting_levels: [2, 3, 4]
    selected_fitting_levels: 2
    # THE parameter that matters, and the reason it is swept rather than
    # defaulted. Each multi-resolution level doubles the B-spline control point
    # mesh, so SimpleITK's default of 4 levels gives a field flexible enough to
    # follow lesion-scale structure — and a large confluent WMH looks exactly
    # like a broad bright patch. N4 then absorbs the disease into the
    # "correction" and flattens it away. Nothing crashes; the image simply
    # comes out with less lesion contrast than it went in with.
    #
    # SWEPT over the 48 training subjects x 3 level counts (sweep_n4.py).
    # Mean / median change in lesion-to-WM contrast-to-noise, by site:
    #
    #   levels   Amsterdam      Singapore      Utrecht        worst site
    #     2      +4.0 / +3.1    +0.7 / +0.7   +27.8 / +20.4    +0.7  PASS
    #     3      +6.3 / +2.9    -1.8 / -1.3   +47.7 / +28.3    -1.8  REJECTED
    #     4     +13.3 / +12.4   -0.0 / -0.9   +47.1 / +20.4    -0.9  REJECTED
    #
    # Only 2 levels keeps every site positive, under both mean and median
    # aggregation. Two further checks agree:
    #   - Fraction of subjects losing MORE than 5% lesion contrast:
    #     0.000 at every site for 2 levels; 6-13% at 3 levels; 6-19% at 4.
    #   - Direct absorption measure (bias field inside lesions / inside NAWM,
    #     where 1.000 means no absorption): max 1.032 at 2 levels, rising to
    #     1.194 at 4 levels. At 2 levels N4 is essentially not touching lesions.
    #
    # CORRECTION TO AN EARLIER FINDING: a first probe on the single
    # highest-burden subject per site suggested Amsterdam was the damaged site
    # (-32.0% at 4 levels). The full 48-subject sweep shows the opposite —
    # Amsterdam GAINS most from aggressive correction, and SINGAPORE is the
    # site that degrades. n=1 per site was not representative, which is exactly
    # why the sweep exists.
    #
    # ACCEPTED COST, stated rather than buried: 2 levels removes a median 13.9%
    # of bias field span, against 27.4% at 3 levels and 45.6% at 4, while
    # SPM12's own correction on this dataset spans 28-38%. We therefore
    # deliberately under-correct relative to SPM12 in exchange for never
    # damaging lesion contrast by more than 5% on any subject. If Week 3 turns
    # out to be limited by residual inhomogeneity rather than by lesion
    # contrast, 3 levels is the documented fallback — but that is a Week 3
    # finding, not an assumption to make here.
    selection_metric: lesion_wm_cnr_change_and_field_span
    # Rule fixed BEFORE the results were seen: reject any setting that reduces
    # mean lesion-to-WM contrast-to-noise on any site; among survivors prefer
    # the largest bias field span removed.
    selection_split: train
    # Selected on the 48 training subjects; confirmed on the 12 val subjects.
    # The official 110 stay sealed until Week 7 (Decision #7).
    known_metric_caveat: >
      The CNR metric conflates two effects: genuine contrast gain from
      flattening the field (which also shrinks the within-ROI spread used as
      the noise estimate) and loss from lesion absorption. That is why the
      independent bias-in-lesion/bias-in-NAWM ratio is reported alongside it —
      the two agree on 2 levels, which is what makes the choice trustworthy.

  skull_strip:
    # R1. ROADMAP 5.2 named SynthStrip primary with FSL FAST as fallback;
    # neither is installable in this environment (no FreeSurfer, no FSL, no
    # Docker/Singularity), so that path has no working implementation and the
    # candidates below replace it. SynthStrip stays the documented escalation
    # if both candidates fail the acceptance metrics.
    candidates: [hdbet_flair, hdbet_t1, deepbet_flair, deepbet_t1]
    selected: hdbet_flair
    # SWEPT over 12 site-stratified training subjects x 4 configurations.
    #
    #   config          WMH retained (worst)   shallow_fraction   brain    runtime
    #   hdbet_flair          1.000000            0.0308 / 0.0618  1371 mL   46.2 s
    #   deepbet_flair        1.000000            0.0327 / 0.0574  1395 mL    1.7 s
    #   hdbet_t1             1.000000            0.0334 / 0.0711  1354 mL   52.1 s
    #   deepbet_t1           1.000000            0.0479 / 0.0977  1526 mL    1.5 s
    #
    # Gate 1 (over-stripping) was passed by ALL FOUR: not one configuration lost
    # a single reference WMH voxel on any subject. That is a genuinely good
    # result and worth stating in the report — the risk ROADMAP 5.2 warns about
    # (over-stripping removing juxtacortical lesions) did not materialise for
    # any candidate on this data.
    #
    # Gate 2 therefore decided it, and HONESTLY THE MARGIN IS NOT SIGNIFICANT.
    # hdbet_flair beats deepbet_flair by 0.0019 in mean shallow_fraction, which
    # on a paired comparison across the same 12 subjects gives Wilcoxon p=0.339
    # and paired t-test p=0.251 — hdbet_flair is better on only 7 of 12
    # subjects, and on the WORST case deepbet_flair is actually better
    # (0.0574 vs 0.0618). These two are statistically indistinguishable here.
    #
    # hdbet_flair is taken because it wins on the pre-fixed rule's primary
    # metric AND on its first tie-break (tighter brain mask, 1371 vs 1395 mL),
    # and because HD-BET is the more established and more widely validated tool
    # (nnU-Net based, multi-sequence), which matters for defending the choice.
    # The cost is runtime: 46 s/subject against deepbet's 1.7 s, i.e. ~46 min
    # for the 60 and a further ~85 min for the 110 test subjects in Week 7,
    # versus about 5 minutes total. That is affordable unattended, so accuracy
    # was preferred over speed — but deepbet_flair is a legitimate drop-in
    # near-equivalent if compute ever becomes the constraint, and swapping it
    # is a one-line change here.
    #
    # Both T1-transfer routes were beaten by their FLAIR counterparts, so the
    # extra dilation and cross-contrast step bought nothing on this dataset.
    # Worth reporting: ROADMAP 5.2 proposed T1-transfer as the robust fallback
    # precisely because T1 is the contrast these tools are strongest on, but
    # measured here it is the weaker route — the brain boundary mismatch it
    # introduces costs more than the better contrast gains.
    t1_transfer_dilation_voxels: 1
    # For the *_t1 routes: orig/T1.nii.gz is already FLAIR-aligned and shares
    # the FLAIR grid exactly, so a T1-derived mask transfers with no
    # registration. T1 and FLAIR brain boundaries differ slightly, hence the
    # dilation (ROADMAP 5.2).
    min_wmh_retained_fraction: 0.999
    # Acceptance criterion 1, catching OVER-stripping. The reference standard
    # is defined only inside the brain, so any brain mask that excludes
    # reference WMH voxels has removed brain. Free, quantitative, and runs on
    # all 170 subjects without manual inspection.
    scalp_rejection_check: true
    shallow_depth_mm: 5.0
    # Acceptance criterion 2, catching UNDER-stripping, which criterion 1 is
    # completely blind to and which is the more dangerous failure for W3.
    # Retained scalp fat is very bright on FLAIR: at Utrecht, zero percent of
    # the brightest 1% of head voxels are WMH, and thresholding at the true
    # WMH median admits a median of 19x (worst case 583x) as many non-WMH
    # voxels as WMH voxels. Any of that surviving into W3 is segmented as
    # lesion.
    #
    # Implemented as `shallow_fraction`: the fraction of brain-mask voxels
    # lying within shallow_depth_mm of the OUTER HEAD SURFACE, measured with a
    # distance transform carrying sampling=voxel_spacing so the threshold is
    # genuinely millimetres and not voxels (in voxels, 5 would mean 15 mm along
    # z on this 3 mm slice grid).
    #
    # CORRECTION, found during post-stage visual verification: this metric is
    # CONFOUNDED and must not be read as "N% of the brain mask is retained
    # scalp". The reasoning behind it assumed the head mask's outer surface is
    # always the outer scalp, so that skull+scalp guarantees several mm of
    # clearance. That fails at the skull base and posterior fossa, where the
    # FLAIR signal outside the brain is very dark (cortical bone, mastoid air):
    # Stage 1's multi-Otsu never captures a shell there, hole-filling cannot
    # bridge it because it is open to the outside, and the head-mask boundary
    # ends up hugging the brain. Measured brain-surface depth reaches 0.0 mm at
    # the 5th percentile on the worst subject. So a large part of
    # shallow_fraction reflects Stage 1 head-mask thinness and genuinely thin
    # temporal skull, not Stage 3 error.
    #
    # It is retained because it was applied identically to all four candidate
    # configurations, so the ranking it produced is a fair comparison — and
    # because the two front-runners were statistically tied on it anyway, so
    # the confound did not decide the outcome. For an absolute statement about
    # under-stripping use bright_tissue_retention() instead (below).
    bright_percentile: 99.0
    # The DIRECT under-stripping test, added after the above was found wanting.
    # Scalp fat is the brightest tissue in a FLAIR head, so retained scalp shows
    # up as bright head voxels surviving inside the brain mask. Measured on the
    # final Stage 3 output across all 60:
    #
    #   site        bright-1% retained in brain    ...of which is real WMH
    #   Utrecht              0.1%                          0.0%
    #   Singapore           52.7%                         31.0%
    #   Amsterdam           85.1%                         24.7%  (max 97%)
    #
    # This must always be read alongside bright_that_is_wmh. At Utrecht the
    # brightest head voxels contain NO lesion, so removing 99.9% of them is
    # exactly right. At Amsterdam and Singapore much of that same top 1% IS
    # reference lesion, so retaining it is correct rather than a failure — a
    # metric ignoring that would score a good mask as broken on two of three
    # sites. Together the two numbers confirm the stripper is discriminating
    # bright-scalp from bright-lesion rather than simply cutting hard.
    selection_rule: >
      Gate 1 (hard): reject any configuration losing reference WMH voxels on
      any subject. Gate 2: among survivors take the lowest mean
      shallow_fraction. Tie-break on tighter brain mask, then runtime. Gate 1
      is a hard gate rather than a scored quantity because the two failures are
      not symmetric — retained scalp can still be removed by the white-matter
      constraint in Week 3, but a lesion deleted at Stage 3 is permanently gone
      from the pipeline.
    selection_n_per_site: 4
    # Selection runs on a site-stratified subset of the training split, because
    # HD-BET is an nnU-Net on CPU here and a full 48x4 sweep is hours for a
    # decision a stratified sample settles. The winning configuration is then
    # applied to all 60 and its acceptance criteria re-checked on every one —
    # nothing is accepted on the strength of the subset alone.

  tissue_segmentation:
    # Not in ROADMAP's Week 2 definition of done (5.6) at all, but required by
    # three separate downstream stages: W2 Stage 5 (WM-referenced
    # normalisation needs a normal-appearing WM reference), W3 (ROADMAP 6.3.1
    # applies a WM mask to remove false positives), and W4 (R5's "deep white
    # matter" is undefined without one). Budgeted here because it is a
    # preprocessing artefact and because leaving it to W3 would block both.
    input: t1  # orig/T1.nii.gz — already FLAIR-aligned, and T1 separates
               # WM/GM/CSF far better than FLAIR, where CSF is nulled by design
    candidates: [sitk_kmeans, sklearn_gmm]
    n_classes: 3  # CSF, grey matter, white matter
    selected: sitk_kmeans
    # Both methods were measured and are near-identical (raw lesion coverage
    # 0.453 vs 0.434; tissue fractions within 0.04 of each other). sitk_kmeans
    # is taken because SimpleITK is already a hard dependency, it is
    # deterministic without a seed, and it is faster. sklearn_gmm is retained as
    # a candidate and is a drop-in.
    bias_correct_input: true
    # The T1 is N4-corrected before segmentation, at the same fitting-level
    # count selected in Stage 2. Intensity-based tissue segmentation is very
    # sensitive to the bias field: an uncorrected gradient splits one tissue
    # into two classes on opposite sides of the brain.
    wm_mask_derivation: filled_wm_class
    # The WM class with in-plane enclosed holes reclaimed. Holes are filled
    # per-slice, not in 3D, because a 3D fill leaks through the natural
    # openings between slices on a 3 mm grid.
    #
    # MEASURED LIMITATION — the most important thing recorded about this stage.
    # WMH are bright on FLAIR but iso- to HYPO-intense on T1, so an
    # intensity-driven segmenter assigns about half of them to grey matter.
    # Across 15 training subjects (5 per site):
    #
    #   variant              lesion coverage (mean / worst)   share of brain
    #   raw WM class                0.478 / 0.245                  0.32
    #   + hole filling              0.785 / 0.298                  0.36
    #   + 1 mm dilation             0.897 / 0.565                  0.50
    #   + 2 mm dilation             0.951 / 0.676                  0.62
    #   + 3 mm dilation             0.971 / 0.710                  0.71
    #   + 4 mm dilation             0.979 / 0.733                  0.78
    #   non-CSF (WM + GM)           0.961 / 0.847                  0.71
    #
    # NO variant reaches 95% worst-case coverage. Dilation inflates the mask
    # without rescuing the hard subjects, because there the lesions are
    # extensive enough to be classified solidly as grey matter rather than
    # sitting at the WM boundary. This is a limit of T1-intensity tissue
    # segmentation, not a tuning problem, and dilation radii are specified in
    # mm rather than voxels because in-plane spacing ranges 0.56-1.30 mm.
    #
    # CONSEQUENCE 1 — revises ROADMAP 6.3.1. That section proposes using a WM
    # mask as a Week 3 false-positive constraint. Doing so with this mask would
    # delete a median 21% and a worst-case 70% of TRUE lesions, capping recall
    # at a level no later stage could recover. wm_mask is therefore published
    # for Week 4's "deep white matter" definition and as a soft prior, NOT as a
    # hard Week 3 constraint. If a constraint is wanted, non-CSF is the safer
    # choice and its cost must still be reported.
    #
    # CONSEQUENCE 2 — for Stage 5 the same behaviour is an ADVANTAGE, and this
    # is now MEASURED, not argued. Normalisation needs *normal-appearing* white
    # matter, and the raw WM class naturally excludes lesions precisely because
    # they are T1-hypointense. Using it as the reference, across all 60:
    #
    #   method                                cross-site CoV of normalised WMH
    #   z-score (ROADMAP 5.4's choice)                    0.525
    #   percentile (p1-p99)                               0.404
    #   WM-referenced, crude head-mask proxy              0.284
    #   WM-referenced, real Stage 4 NAWM                  0.074   <-- 7x better
    #
    # Lesion contamination of the NAWM reference is <= 5% on every one of the
    # 60 subjects (mean 0.8-1.9% by site), and the smallest reference is 88,737
    # voxels, so the median is statistically stable.
    #
    # The resulting FLAIR(lesion)/FLAIR(NAWM) ratio is 1.56 (Amsterdam), 1.39
    # (Singapore), 1.61 (Utrecht) — i.e. lesions sit about 1.4-1.6x normal white
    # matter on EVERY scanner. That is what makes a fixed threshold transfer
    # across sites, and therefore what makes ROADMAP 6.1's Route A threshold
    # baseline viable at all. Stage 5 reads the tissue label map's WM class
    # directly rather than the hole-filled wm_mask.
    plausible_fractions:
      csf: [0.05, 0.40]
      gm:  [0.25, 0.60]
      wm:  [0.20, 0.55]
    # Sanity band asserted per subject. A segmentation that collapses two
    # classes together fails here loudly rather than in a figure nobody opens.
    # antspyx (ANTs Atropos) was the obvious tool and is deliberately NOT used:
    # it publishes no cp314 wheel, so pip falls back to a full ITK/ANTs source
    # compile. SimpleITK's ScalarImageKmeansImageFilter and scikit-learn's
    # GaussianMixture are both already available and are what FSL FAST is
    # built on conceptually (GMM over intensities), so nothing is lost.

  normalisation:
    # R2. ROADMAP 5.4 recommended z-score within the brain mask as primary.
    # Measured across all 60 training subjects, that recommendation FAILS and
    # is overridden here:
    #   cross-site coefficient of variation of the normalised WMH level —
    #     z-score    0.525
    #     percentile 0.404
    #     WM-referenced 0.284   <- best
    #   correlation with lesion burden (want ~0, i.e. normalisation must not
    #   depend on how sick the patient is) —
    #     z-score    -0.235
    #     WM-referenced +0.015  <- effectively decoupled
    # Under z-score, WMH lands at 2.89 at Amsterdam but 0.84 at Utrecht, and
    # the lowest subject's WMH median (0.24) falls BELOW the highest subject's
    # WM median (0.99) — so no fixed threshold transfers across sites. That
    # directly breaks ROADMAP 6.1 Route A, the intensity-threshold baseline
    # ROADMAP itself calls essential. WM-referenced normalisation is what makes
    # a fixed threshold meaningful, which is also what ROADMAP 5.4's own
    # closing paragraph says should happen if W3 takes the thresholding route.
    primary: wm_referenced
    comparators: [z_score, percentile]
    wm_reference_value: 1.0   # normal-appearing white matter maps to 1.0, so
                              # WMH land above 1.0 on every scanner
    percentile_range: [1, 99]
    per_subject: true
    # Statistics come from each subject's own brain voxels. Fitting
    # normalisation on the training set and applying it to test would be both
    # leakage and unnecessary (ROADMAP 5.4).
    selection_metric: cross_site_cov_and_threshold_margin
    # NOTE — this field previously named cross_site_coefficient_of_variation
    # alone. It was widened after measurement showed that metric is an
    # INCOMPLETE proxy, and the change is recorded rather than made silently.
    #
    # Measured on the real pipeline output, all 60 subjects:
    #
    #   metric                                     z-score  percentile  WM-ref
    #   cross-site CoV of normalised lesion level   0.130     0.029      0.074
    #   correlation with disease burden (want ~0)  +0.421    -0.457     +0.306
    #   within-site subject-to-subject spread       0.138     0.064      0.064
    #   margin above brain tissue / separation        51%       38%        49%
    #   margin growth, mild -> severe subjects       +23%      +12%       +33%
    #
    # PERCENTILE WINS THE ORIGINALLY PRE-REGISTERED METRIC (0.029 vs 0.074).
    # WM-referenced is nonetheless retained, for reasons stated rather than
    # assumed: it has the larger relative threshold margin (49% vs 38%), its
    # margin grows fastest with severity (+33% vs +12%) so the hardest subjects
    # get easier not harder, percentile's scale is set by a p99 that lesions
    # themselves inflate (hence its -0.457 burden correlation, a known defect
    # rather than a neutral trade), and WM-referencing is the only one of the
    # three with a physical meaning — "1.0 = normal white matter, lesions at
    # 1.4-1.6x" is interpretable and directly reusable in Week 4.
    #
    # This is a deviation from a pre-registered rule and is flagged as such. If
    # a reviewer prefers the pre-registered metric, switching to percentile is
    # one line here plus a 30-second re-run; the full per-subject comparison for
    # all three methods is written to stage5_method_comparison.csv either way.
    verified_nawm_at_exactly_1: true
    # Acceptance check, asserted per subject: WM-referenced must place
    # normal-appearing WM at exactly 1.0. Passes for all 60.

  denoising:
    # ROADMAP 5.5 / risk register #12. Implemented as an evaluated branch and
    # expected to be REJECTED — recording that expectation here so the result
    # is a measured finding rather than a retrofitted excuse either way.
    # Reason to doubt it: 49.6% of the 3,680 reference lesions in the training
    # set are <=5 voxels and 69.2% are <=10 voxels, yet those carry only 1.5%
    # and 3.1% of total lesion volume. Any smoothing that removes them
    # devastates lesion recall and lesion F1 while barely moving Dice, which is
    # volume-weighted and therefore blind to exactly this failure. Meanwhile
    # measured lesion-to-WM CNR is already 7.0 (Utrecht), 14.9 (Singapore) and
    # 21.7 (Amsterdam), so there is little noise to win back.
    enabled_in_pipeline: false
    # MEASURED AND REJECTED. All three candidates fail the rule, on 48 training
    # subjects:
    #
    #   method                  small-lesion retention   CNR change   SSIM
    #   curvature diffusion            0.657 FAIL          +8.1%     0.981
    #   gaussian                       0.486 FAIL         -19.8%     0.933
    #   CLAHE                          5.920 (see below)  -57.0%     0.791
    #
    # The un-filtered normalised FLAIR from Stage 5 remains the Week 3 input.
    # This confirms the expectation recorded in preprocessing/denoise.py BEFORE
    # measuring, which is what makes it a finding rather than a rationalisation.
    #
    # THE HEADLINE RESULT, and the strongest argument in this stage: SSIM is
    # blind to the damage. Anisotropic diffusion scores SSIM 0.981 — "the image
    # is essentially unchanged" — while small lesions keep only 66% of their
    # contrast on average and 31% on the worst subject, and 399 individual
    # reference lesions across the cohort lose more than half. Gaussian destroys
    # 878. Dice would not have revealed this either, being volume-weighted:
    # these lesions are 69% of the population but 3% of the volume. This is
    # exactly why the selection metric is per-lesion contrast retention and NOT
    # SSIM or Dice, and it is worth stating in the report as a methodological
    # point rather than only as a negative result.
    #
    # KNOWN FLAW IN THE RULE AS WRITTEN, recorded rather than quietly fixed:
    # "retention >= 0.95" is ONE-SIDED, so CLAHE's retention of 5.92 counted as
    # a pass. A retention far ABOVE 1.0 is not preservation — it means the
    # transform amplified lesion contrast roughly six-fold and therefore
    # destroyed the intensity semantics Stage 5 established, where 1.0 is
    # normal-appearing white matter. The rule should have been a two-sided band
    # (0.95 <= retention <= 1.05). The outcome is unaffected because CLAHE was
    # rejected anyway on its -57% CNR, but a method could in principle have
    # passed this rule while wrecking the scale.
    candidates: [curvature_anisotropic_diffusion, gaussian, patch_based]
    small_lesion_voxel_threshold: 10
    minimum_small_lesion_retention: 0.95
    patch_based_excluded_reason: >
      Implemented in denoise.py but excluded from the sweep on cost. Timed on a
      single subject it had not finished after 18 minutes, i.e. >18 h for the 60
      and >33 h more for the 110 in Week 7, for a branch already expected to be
      rejected and whose two cheaper relatives both failed decisively.
    selection_metric: small_lesion_contrast_retention_and_cnr
    # Decision rule, fixed before the sweep ran: adopt a filter only if it
    # leaves >= 95% of small-lesion contrast intact AND improves lesion-to-WM
    # contrast-to-noise. Otherwise reject and report the numbers.
    #
    # "Contrast retention" is measured per reference lesion component on the
    # Stage 5 WM-referenced scale, where 1.0 is normal-appearing white matter:
    #   retention = (intensity_after - 1.0) / (intensity_before - 1.0)
    # 1.0 means untouched, 0.0 means smoothed into the surrounding tissue.
    # Reported per lesion-size bin, because the entire question is whether small
    # lesions survive. Deliberately NOT Dice (volume-weighted, so structurally
    # blind to losing half the lesion population) and NOT SSIM (whole-image
    # perceptual similarity, says nothing about lesions).
    #
    # patch_based is implemented but EXCLUDED from the sweep on cost: the
    # SimpleITK filter takes many minutes per subject on CPU, i.e. hours for the
    # 60 and more again for the 110 in Week 7, for a branch already expected to
    # be rejected. Recorded rather than quietly omitted.
    gaussian_sigma_mm: 1.0
    # Naive smoothing, included only as the floor of the comparison — the method
    # that demonstrably should not be used, so the better filters have something
    # to be better than.
    # Gated on small-lesion preservation, NOT on Dice and NOT on SSIM.
    persist_outputs: true
    # W7 (ROADMAP 9.3) reports SSIM for pre-processing quality; that comparison
    # needs the denoised/original pair still on disk. Persisting is what stops
    # W7 discovering the inputs were never kept.

  contrast_enhancement:
    # ROADMAP 5.5. Optional branch, never the default. Enhancement is a
    # non-linear, spatially varying intensity transform, so it breaks the
    # intensity semantics that both the threshold baseline (W3 Route A) and any
    # intensity-feature model depend on. One challenge team (uned_enhanced)
    # did use non-linear FLAIR enhancement, so it is not disqualifying — it
    # just has to be justified against the un-enhanced path rather than assumed.
    method: clahe
    enabled_in_pipeline: false
    clip_limit: 0.01
    kernel_size_fraction: 0.125
    apply_in_plane_only: true
    # 2D, in-plane. A 3D tile on a grid with 3 mm slices against ~1 mm in-plane
    # spans wildly different physical distances per axis.

  morphology:
    # MEASURED on the 48 training reference masks (characterise_morphology.py).
    # These numbers are the CEILING for Week 3: a size filter cannot lose fewer
    # true lesions than this.
    #
    #   min size    volume      lesions deleted    volume deleted
    #     2 vox     6.2 mm3          9.8%              0.31%
    #     3 vox     9.3 mm3         24.2%              1.25%
    #     5 vox    15.5 mm3         43.5%              3.44%
    #    10 vox    30.9 mm3         66.4%              7.74%
    #    20 vox    61.8 mm3         80.9%             13.99%
    #
    # The two columns diverge by roughly an order of magnitude, which is the
    # whole point: removing components under 5 voxels deletes 43.5% of the
    # lesion POPULATION while touching 3.4% of the VOLUME. Dice would barely
    # move; lesion F1 and lesion recall would collapse. Week 3 must tune this on
    # predictions, on the validation split only, and report the trade-off curve.
    #
    # OPENING is far worse and should essentially never be applied to lesion
    # masks on this data — fraction of reference lesion VOLUME destroyed:
    #   1 mm radius: 42.6% mean, 97.3% worst
    #   2 mm radius: 69.6% mean, 100%  worst  (complete annihilation on some)
    #   3 mm radius: 83.7% mean, 100%  worst
    #
    # CONNECTIVITY: 6-connectivity finds 82.6 components per subject against
    # 64.7 for 26-connectivity, a factor of 1.30. Week 4 reports both
    # (ROADMAP 7.2); 26 is the project default, matching checks/evaluation.py.
    # ROADMAP 5.5 lists morphological processing under Week 2, but its actual
    # use in this pipeline is false-positive removal AFTER segmentation.
    # Operators are implemented and validated here in W2 and applied in W3;
    # both reports say so.
    implemented_in_week: 2
    applied_in_week: 3
    connectivity: 26   # matches checks/evaluation.py (SetFullyConnected(True))
    min_lesion_size_voxels: null
    # Swept in W3 against the lesion-recall / lesion-F1 trade-off curve on the
    # validation split only. Deliberately left unset here: with 49.6% of
    # reference lesions at <=5 voxels, any minimum-size filter trades directly
    # between two scored metrics and must not be guessed.
